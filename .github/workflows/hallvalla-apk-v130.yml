name: HallValla APK v130

on:
  push:
    branches: [hallvalla-apk-v130-build]
    paths:
      - '.hallvalla-android/**'
      - '.github/workflows/hallvalla-apk-v130.yml'
  pull_request:
    branches: [main]
    paths:
      - '.hallvalla-android/**'
      - '.github/workflows/hallvalla-apk-v130.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Generate permanent HallValla signing key
        shell: bash
        run: |
          set -euo pipefail
          PASS="$(openssl rand -hex 24)"
          KS="$GITHUB_WORKSPACE/.hallvalla-android/hallvalla-release.p12"
          keytool -genkeypair -v \
            -storetype PKCS12 \
            -keystore "$KS" \
            -alias hallvalla \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname 'CN=HallValla Release, OU=Game, O=HallValla, L=San Jose, ST=San Jose, C=CR'
          echo "HALLVALLA_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          echo "HALLVALLA_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "HALLVALLA_KEY_ALIAS=hallvalla" >> "$GITHUB_ENV"
          INFO="$GITHUB_WORKSPACE/.hallvalla-android/SIGNING_INFO.txt"
          {
            echo 'HALLVALLA ANDROID RELEASE SIGNING'
            echo '================================='
            echo 'Application ID: com.hallvalla.game'
            echo 'Alias: hallvalla'
            echo "Keystore password: $PASS"
            echo 'Keystore type: PKCS12'
            echo 'Initial versionCode: 130'
            echo 'Initial versionName: 1.0.130'
            echo
            echo 'IMPORTANT: Keep this keystore and password. Every future APK update must use the same key.'
            echo
            keytool -list -v -keystore "$KS" -alias hallvalla -storepass "$PASS"
          } > "$INFO"

      - name: Build signed release APK
        working-directory: .hallvalla-android
        run: gradle --no-daemon clean assembleRelease

      - name: Verify signature and stage package
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/.hallvalla-android/release-output"
          mkdir -p "$OUT"
          cp "$GITHUB_WORKSPACE/.hallvalla-android/app/build/outputs/apk/release/app-release.apk" "$OUT/HallValla-v130-release.apk"
          cp "$GITHUB_WORKSPACE/.hallvalla-android/hallvalla-release.p12" "$OUT/hallvalla-release.p12"
          cp "$GITHUB_WORKSPACE/.hallvalla-android/SIGNING_INFO.txt" "$OUT/SIGNING_INFO.txt"
          cp "$GITHUB_WORKSPACE/.hallvalla-android/README.md" "$OUT/ANDROID_UPDATE_GUIDE.md"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$OUT/HallValla-v130-release.apk" > "$OUT/APK_SIGNATURE_VERIFY.txt"
          sha256sum "$OUT/HallValla-v130-release.apk" "$OUT/hallvalla-release.p12" > "$OUT/SHA256SUMS.txt"

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: HallValla-v130-APK-SIGNED
          path: .hallvalla-android/release-output/
          if-no-files-found: error
          retention-days: 7
