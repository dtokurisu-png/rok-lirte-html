name: R.O.K. Next - importar modelo Farolera
on:
  push:
    paths:
      - ".github/workflows/rok-next-modelos.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  copy-farolera:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio R.O.K.
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Descargar GLB original del tester publico
        run: |
          set -euo pipefail
          DEST="nueva-version/frontend/recursos/modelos-3d/farolera/chiara_idle.glb"
          if [ -f "$DEST" ]; then
            echo "El modelo ya esta presente en R.O.K."
            exit 0
          fi
          mkdir -p "$(dirname "$DEST")"
          curl --fail --location --retry 3 --silent --show-error \
            'https://raw.githubusercontent.com/dtokurisu-png/rok-3d-test/main/assets/models/casters/farolera/chiara_idle.glb' \
            --output "$DEST"
          ACTUAL="$(wc -c < "$DEST" | tr -d ' ')"
          test "$ACTUAL" -eq 4901316
          echo "GLB verificado: $ACTUAL bytes"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "assets(rok-next): import Farolera GLB from 3D tester"
          git push origin HEAD:main
