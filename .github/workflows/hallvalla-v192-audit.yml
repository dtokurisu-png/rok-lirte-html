name: HallValla v192 architecture audit

on:
  push:
    branches: [hallvalla-v192-architecture-audit]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Elberlord/Hallvalla
          ref: main
          path: hvsrc
      - name: Run deep static audit
        run: python3 .hallvalla-v192/audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: HallValla-v192-audit-pre
          path: audit/
          retention-days: 2
