name: Migrate legacy image references

on:
  push:
    branches: [main]
    paths:
      - 'scripts/migrate-image-paths.mjs'
      - '.github/workflows/migrate-image-paths.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Migrate references without touching game logic
        run: node scripts/migrate-image-paths.mjs
      - name: Check image path references and JavaScript validity
        run: node scripts/verify-image-paths.mjs
      - name: Commit only verified migration files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.js style.css index.html firebase-online.js sw.js
          git add nueva-version/frontend/js/adventure-bridge.js nueva-version/frontend/js/ui/spellbook-hud.js
          git add assets/manifests/image-migration-status.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No hay cambios de rutas."
            exit 0
          fi
          git commit -m "refactor(assets): move 175 image references to organized canonical paths"
          git push origin HEAD:main
