name: HallValla APK v131 Native Google

on:
  push:
    branches: [hallvalla-apk-v130-build]
    paths:
      - '.hallvalla-android/**'
      - '.github/workflows/hallvalla-apk-v131.yml'

permissions:
  contents: read
  actions: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Ensure Android 35 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Restore permanent HallValla signing key from v130 artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hv-signing"
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/dtokurisu-png/rok-lirte-html/actions/artifacts/10391507027/zip' \
            -o "$RUNNER_TEMP/hv-signing/v130-signing.zip"
          unzip -q "$RUNNER_TEMP/hv-signing/v130-signing.zip" -d "$RUNNER_TEMP/hv-signing/files"
          KS="$RUNNER_TEMP/hv-signing/files/hallvalla-release.p12"
          INFO="$RUNNER_TEMP/hv-signing/files/SIGNING_INFO.txt"
          test -s "$KS"
          test -s "$INFO"
          PASS="$(sed -n 's/^Keystore password: //p' "$INFO" | head -n 1)"
          test -n "$PASS"
          echo "HALLVALLA_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          echo "HALLVALLA_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "HALLVALLA_KEY_ALIAS=hallvalla" >> "$GITHUB_ENV"
          keytool -list -v -keystore "$KS" -alias hallvalla -storepass "$PASS" | grep -E 'SHA1:|SHA256:'

      - name: Build signed release APK
        working-directory: .hallvalla-android
        run: gradle --no-daemon clean assembleRelease

      - name: Verify signature and stage v131
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/.hallvalla-android/release-output-v131"
          mkdir -p "$OUT"
          APK="$GITHUB_WORKSPACE/.hallvalla-android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          cp "$APK" "$OUT/HallValla-v131-native-google-release.apk"
          cp "$GITHUB_WORKSPACE/.hallvalla-android/README.md" "$OUT/ANDROID_V131_NOTES.md"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$OUT/HallValla-v131-native-google-release.apk" > "$OUT/APK_SIGNATURE_VERIFY.txt"
          sha256sum "$OUT/HallValla-v131-native-google-release.apk" > "$OUT/SHA256SUMS.txt"
          grep -q 'Signer #1 certificate SHA-256 digest: 9f2c07b9e8ba00bb8766a76bef760a5bc0fe8dbde528e34c2ee4ae337e7a1c3b' "$OUT/APK_SIGNATURE_VERIFY.txt"
          cd "$GITHUB_WORKSPACE"
          zip -qr "$OUT/HallValla_Android_v131_PROJECT.zip" .hallvalla-android \
            -x '.hallvalla-android/app/build/*' \
               '.hallvalla-android/.gradle/*' \
               '.hallvalla-android/release-output-v131/*' \
               '.hallvalla-android/*.p12'

      - name: Upload v131 release bundle
        uses: actions/upload-artifact@v4
        with:
          name: HallValla-v131-NATIVE-GOOGLE-SIGNED
          path: .hallvalla-android/release-output-v131/
          if-no-files-found: error
          retention-days: 7
